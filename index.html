        }


        /* =========================
           HEADER
        ========================= */

        }

            margin: 0;
            font-size: 28px;
        }

        header p {

            color: #ccc;
            font-size: 14px;
        }


        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {
            max-width: 1100px;
            margin: 18px auto;
            padding: 0 20px;
        }


        /* =========================
           SEARCH BOX
        ========================= */

        .search-box {
            background: white;
            padding: 20px;
            border-radius: 14px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
            text-align: center;
        }

        .search-box h2 {
            margin-top: 0;
            margin-bottom: 14px;
            font-size: 21px;
        }

        .search-area {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .search-area input {
            width: 500px;
            max-width: 70%;
            padding: 15px;
            font-size: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
        }

        .search-area input:focus {
            border-color: #111;
        }

        .search-area button {
            padding: 15px 28px;
            font-size: 18px;
            background: #111;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .search-area button:hover {
            background: #333;
        }


        /* =========================
           RESULT
        ========================= */

        .result {
            margin-top: 15px;
            font-size: 21px;
            font-weight: bold;
        }

        .result .zone {
            color: #111;
        }

        .result.error {
            color: #c0392b;
        }


        /* =========================
           MAP SECTION
        ========================= */

        .map-section {
            display: none;
            margin-top: 15px;
            background: white;
            padding: 12px;
            border-radius: 14px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        .map-section.active {
            display: block;
        }

        .map-section h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 20px;
        }


        /* =========================
           MAP CONTAINER
        ========================= */

        .map-container {
            position: relative;
            width: fit-content;
            max-width: 100%;
            margin: 0 auto;
        }

        .map {
            width: auto;
            max-width: 100%;
            max-height: 52vh;
            height: auto;
            display: block;
            object-fit: contain;
        }


        /* =========================
           HIGHLIGHT
        ========================= */

        .zone-highlight {
            position: absolute;

            border: 4px solid #ff0000;

            background: rgba(255, 255, 0, 0.12);

            box-shadow:
                0 0 8px rgba(255, 0, 0, 0.9),
                inset 0 0 8px rgba(255, 0, 0, 0.35);

            pointer-events: none;

            display: none;

            z-index: 10;

            border-radius: 3px;
        }

        .zone-highlight.active {
            display: block;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            header h1 {
                font-size: 24px;
            }

            .container {
                margin: 12px auto;
                padding: 0 10px;
            }

            .search-box {
                padding: 16px;
            }

            .search-area {
                flex-direction: column;
            }

            .search-area input {
                width: 100%;
                max-width: 100%;
            }

            .search-area button {
                width: 100%;
            }

            .result {
                font-size: 20px;
            }

            .map-section {
                padding: 8px;
            }

            .map {
                max-height: none;
                width: 100%;
            }

        }

    </style>

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

/* Load the complete PI index from the uploaded 2026 workbook. */
async function loadPiWorkbook() {
    const result = document.getElementById("result");
    try {
        if (typeof XLSX === "undefined") throw new Error("Spreadsheet parser did not load.");
        const response = await fetch("UPDATED%202026%20-%20PI%20Zones.xlsx", { cache: "no-cache" });
        if (!response.ok) throw new Error("Workbook request failed: " + response.status);
        const workbook = XLSX.read(await response.arrayBuffer(), { type: "array" });
        const sheet = workbook.Sheets["PI SECTION"];
        if (!sheet) throw new Error('The "PI SECTION" worksheet was not found.');
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
        const headers = (rows[1] || []).map(value => String(value).trim().toUpperCase());
        const col = name => headers.indexOf(name);
        const piCol = col("PI"), floorCol = col("FLOOR"), zoneCol = col("ZONE");
        const descriptionCol = col("DESCRIPTION"), detailCol = col("DETAIL"), detail2Col = col("DETAIL 2");
        if ([piCol, floorCol, zoneCol, descriptionCol].some(index => index < 0)) {
            throw new Error("The workbook columns do not match the expected layout.");
        }
        const completeData = {};
        for (const row of rows.slice(2)) {
            const piValue = row[piCol];
            if (piValue === "" || piValue === null || piValue === undefined) continue;
            const pi = String(piValue).trim().replace(/\\.0$/, "");
            if (!pi) continue;
            completeData[pi] = {
                floor: String(row[floorCol] ?? "").trim(),
                zone: String(row[zoneCol] ?? "").trim(),
                description: String(row[descriptionCol] ?? "").trim(),
                detail: detailCol >= 0 ? String(row[detailCol] ?? "").trim() : "",
                detail2: detail2Col >= 0 ? String(row[detail2Col] ?? "").trim() : ""
            };
        }
        if (Object.keys(completeData).length) {
            sectionData = completeData;
            window.piDataLoaded = true;
        } else {
            throw new Error("No PI entries were found in the workbook.");
        }
    } catch (error) {
        console.error("Could not load the PI workbook:", error);
        window.piDataLoaded = false;
        if (result) {
            result.innerHTML = "Couldn't load the full PI list. Please refresh the page or try again.";
            result.className = "result error";
        }
    }
}



/* =====================================================
   SEARCH
===================================================== */


function findItem() {

    const input = document.getElementById("itemSearch");
    const pi = input.value.trim();
    const result = document.getElementById("result");

    document.querySelectorAll(".map-section").forEach(map => {
        map.classList.remove("active");
    });

    document.querySelectorAll(".zone-highlight").forEach(highlight => {
        highlight.classList.remove("active");
    });

    if (pi === "") {
        result.innerHTML = "Please enter a PI number.";
        result.className = "result error";
        return;
    }

    const section = sectionData[pi];

    if (!section) {
        result.innerHTML = "PI not found.";
        result.className = "result error";
        return;
    }

    const zoneNumber = parseInt(section.zone, 10);
    const floorText = getFloorText(section.floor);

    const details = [
        section.description,
        section.detail,
        section.detail2
    ].filter(Boolean).join(" - ");

    result.innerHTML =
        "<strong>Zone " + zoneNumber + " - " + floorText + "</strong>" +
        (details ? "<br>" + details : "");

    result.className = "result";

    const map = getMapForZone(zoneNumber);

    if (!map) {
        result.innerHTML +=
            "<br><span style='font-size:16px;font-weight:normal;color:#666;'>Map for this zone is not available yet.</span>";
        return;
    }

    if (map === "mens") {
        document.getElementById("mensMap").classList.add("active");
        highlightMensZone(zoneNumber);
    }

    if (map === "womens") {
        document.getElementById("womensMap").classList.add("active");
        highlightWomensZone(zoneNumber);
    }

    if (map === "additional") {
        document.getElementById("additionalMap").classList.add("active");
        highlightAdditionalZone(zoneNumber);
    }
}


function getFloorText(floor) {

    const floorNumber = parseInt(floor, 10);

    if (floorNumber === 1) return "1st Floor";
    if (floorNumber === 2) return "2nd Floor";
    if (floorNumber === 3) return "3rd Floor";
    if (floorNumber === 4) return "4th Floor";

    return "Floor " + floorNumber;
}


function getMapForZone(zone) {

    if ((zone >= 1 && zone <= 10) || (zone >= 30 && zone <= 38)) return "mens";
    if ((zone >= 11 && zone <= 13) || (zone >= 39 && zone <= 53)) return "womens";
    if (zone >= 80 && zone <= 85) return "additional";

    return null;
}
