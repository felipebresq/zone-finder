<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zone Finder</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #111;
        }

        /* HEADER */

        header {
            background: #111;
            color: white;
            text-align: center;
            padding: 35px 20px;
        }

        header h1 {
            margin: 0;
            font-size: 36px;
        }

        header p {
            margin: 10px 0 0;
            color: #ccc;
            font-size: 17px;
        }

        /* MAIN */

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* SEARCH */

        .search-box {
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
            text-align: center;
        }

        .search-box h2 {
            margin-top: 0;
            margin-bottom: 20px;
        }

        .search-area {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .search-area input {
            width: 500px;
            max-width: 70%;
            padding: 15px;
            font-size: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .search-area button {
            padding: 15px 28px;
            font-size: 18px;
            background: #111;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .search-area button:hover {
            background: #333;
        }

        /* RESULT */

        .result {
            margin-top: 25px;
            font-size: 21px;
            font-weight: bold;
        }

        .result .zone {
            color: #d35400;
        }

        .error {
            color: #c0392b;
        }

        /* MAP */

        .map-section {
            display: none;
            margin-top: 30px;
            background: white;
            padding: 20px;
            border-radius: 14px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        .map-section.active {
            display: block;
        }

        .map-section h2 {
            text-align: center;
            margin-top: 0;
        }

        .map-container {
            position: relative;
            width: 100%;
        }

        .map {
            width: 100%;
            display: block;
        }

        /* HIGHLIGHT */

        .zone-highlight {
            position: absolute;
            border: 5px solid #ff0000;
            background: rgba(255, 255, 0, 0.25);
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.8);
            pointer-events: none;
            display: none;
            z-index: 5;
        }

        .zone-highlight.active {
            display: block;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            header h1 {
                font-size: 28px;
            }

            .search-area {
                flex-direction: column;
            }

            .search-area input {
                width: 100%;
                max-width: 100%;
            }

            .search-area button {
                width: 100%;
            }

        }

    </style>

</head>


<body>


<header>

    <h1>Zone Finder</h1>

    <p>Find the location of an item</p>

</header>



<div class="container">


    <!-- SEARCH -->

    <div class="search-box">

        <h2>Search for an Item</h2>

        <div class="search-area">

            <input
                type="text"
                id="itemSearch"
                placeholder="Enter item number..."
                onkeypress="handleEnter(event)"
            >

            <button onclick="findItem()">
                Search
            </button>

        </div>

        <div
            class="result"
            id="result"
        ></div>

    </div>



    <!-- MEN'S MAP -->

    <div
        class="map-section"
        id="mensMap"
    >

        <h2>Men's Universe</h2>

        <div class="map-container">

            <img
                class="map"
                src="map-mens.png.png"
                alt="Men's Universe Map"
            >

            <div
                class="zone-highlight"
                id="mensHighlight"
            ></div>

        </div>

    </div>



    <!-- WOMEN'S MAP -->

    <div
        class="map-section"
        id="womensMap"
    >

        <h2>Women's Universe</h2>

        <div class="map-container">

            <img
                class="map"
                src="map-womens.png.png"
                alt="Women's Universe Map"
            >

            <div
                class="zone-highlight"
                id="womensHighlight"
            ></div>

        </div>

    </div>



    <!-- ADDITIONAL STOCKROOM -->

    <div
        class="map-section"
        id="additionalMap"
    >

        <h2>Additional Stockroom</h2>

        <div class="map-container">

            <img
                class="map"
                src="map-additional.png.png"
                alt="Additional Stockroom Map"
            >

            <div
                class="zone-highlight"
                id="additionalHighlight"
            ></div>

        </div>

    </div>


</div>



<script>


/* =========================================
   TEST ITEM DATABASE
   ========================================= */


const itemLocations = {

    "100001": {
        map: "mens",
        zone: 1
    },

    "100002": {
        map: "mens",
        zone: 5
    },

    "100003": {
        map: "mens",
        zone: 10
    },


    "200001": {
        map: "womens",
        zone: 11
    },

    "200002": {
        map: "womens",
        zone: 12
    },

    "200003": {
        map: "womens",
        zone: 13
    },


    "300001": {
        map: "additional",
        zone: 80
    },

    "300002": {
        map: "additional",
        zone: 82
    },

    "300003": {
        map: "additional",
        zone: 85
    }

};



/* =========================================
   SEARCH FUNCTION
   ========================================= */


function findItem() {

    const input =
        document.getElementById("itemSearch");

    const item =
        input.value.trim();

    const result =
        document.getElementById("result");


    /*
       Hide all maps
    */

    document
        .querySelectorAll(".map-section")
        .forEach(map => {

            map.classList.remove("active");

        });


    /*
       Hide all highlights
    */

    document
        .querySelectorAll(".zone-highlight")
        .forEach(highlight => {

            highlight.classList.remove("active");

        });


    /*
       Empty search
    */

    if (item === "") {

        result.innerHTML =
            "Please enter an item number.";

        result.className =
            "result error";

        return;

    }


    /*
       Find item
    */

    const location =
        itemLocations[item];


    /*
       Item doesn't exist
    */

    if (!location) {

        result.innerHTML =
            "Item not found.";

        result.className =
            "result error";

        return;

    }


    /*
       Show result
    */

    result.innerHTML =
        "Item <strong>" +
        item +
        "</strong> is located in <span class='zone'>Zone " +
        location.zone +
        "</span>.";

    result.className =
        "result";


    /*
       Show correct map
    */

    if (location.map === "mens") {

        document
            .getElementById("mensMap")
            .classList.add("active");

        highlightMensZone(location.zone);

    }


    if (location.map === "womens") {

        document
            .getElementById("womensMap")
            .classList.add("active");

        highlightWomensZone(location.zone);

    }


    if (location.map === "additional") {

        document
            .getElementById("additionalMap")
            .classList.add("active");

        highlightAdditionalZone(location.zone);

    }

}



/* =========================================
   ENTER KEY
   ========================================= */


function handleEnter(event) {

    if (event.key === "Enter") {

        findItem();

    }

}



/* =========================================
   MEN'S ZONES
   ========================================= */


function highlightMensZone(zone) {

    const highlight =
        document.getElementById("mensHighlight");


    /*
       These are temporary positions.
       We will adjust them to match
       the actual map precisely.
    */


    const zones = {

        1: {
            left: "0%",
            top: "0%",
            width: "20%",
            height: "35%"
        },

        2: {
            left: "20%",
            top: "0%",
            width: "20%",
            height: "35%"
        },

        3: {
            left: "40%",
            top: "0%",
            width: "20%",
            height: "35%"
        },

        4: {
            left: "60%",
            top: "0%",
            width: "20%",
            height: "35%"
        },

        5: {
            left: "80%",
            top: "0%",
            width: "20%",
            height: "35%"
        },

        6: {
            left: "0%",
            top: "35%",
            width: "25%",
            height: "35%"
        },

        7: {
            left: "25%",
            top: "35%",
            width: "25%",
            height: "35%"
        },

        8: {
            left: "50%",
            top: "35%",
            width: "25%",
            height: "35%"
        },

        9: {
            left: "75%",
            top: "35%",
            width: "25%",
            height: "35%"
        },

        10: {
            left: "0%",
            top: "70%",
            width: "100%",
            height: "30%"
        }

    };


    const position =
        zones[zone];


    if (!position) return;


    highlight.style.left =
        position.left;

    highlight.style.top =
        position.top;

    highlight.style.width =
        position.width;

    highlight.style.height =
        position.height;


    highlight.classList.add("active");

}



/* =========================================
   WOMEN'S ZONES
   ========================================= */


function highlightWomensZone(zone) {

    const highlight =
        document.getElementById("womensHighlight");


    const zones = {

        11: {
            left: "0%",
            top: "0%",
            width: "33.33%",
            height: "100%"
        },

        12: {
            left: "33.33%",
            top: "0%",
            width: "33.33%",
            height: "100%"
        },

        13: {
            left: "66.66%",
            top: "0%",
            width: "33.34%",
            height: "100%"
        }

    };


    const position =
        zones[zone];


    if (!position) return;


    highlight.style.left =
        position.left;

    highlight.style.top =
        position.top;

    highlight.style.width =
        position.width;

    highlight.style.height =
        position.height;


    highlight.classList.add("active");

}



/* =========================================
   ADDITIONAL STOCKROOM ZONES
   ========================================= */


function highlightAdditionalZone(zone) {

    const highlight =
        document.getElementById("additionalHighlight");


    const zones = {

        80: {
            left: "0%",
            top: "0%",
            width: "24%",
            height: "47%"
        },

        81: {
            left: "24%",
            top: "0%",
            width: "23%",
            height: "47%"
        },

        82: {
            left: "47%",
            top: "0%",
            width: "24%",
            height: "47%"
        },

        83: {
            left: "71%",
            top: "0%",
            width: "29%",
            height: "47%"
        },

        84: {
            left: "82%",
            top: "47%",
            width: "10%",
            height: "15%"
        },

        85: {
            left: "68%",
            top: "47%",
            width: "15%",
            height: "15%"
        }

    };


    const position =
        zones[zone];


    if (!position) return;


    highlight.style.left =
        position.left;

    highlight.style.top =
        position.top;

    highlight.style.width =
        position.width;

    highlight.style.height =
        position.height;


    highlight.classList.add("active");

}


</script>


</body>

</html>
