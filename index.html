<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zone Finder</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #111;
        }


        /* =========================
           HEADER
        ========================= */

        header {
            background: #111;
            color: white;
            text-align: center;
            padding: 35px 20px;
        }

        header h1 {
            margin: 0;
            font-size: 36px;
        }

        header p {
            margin: 10px 0 0;
            color: #ccc;
            font-size: 17px;
        }


        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }


        /* =========================
           SEARCH BOX
        ========================= */

        .search-box {
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
            text-align: center;
        }

        .search-box h2 {
            margin-top: 0;
            margin-bottom: 20px;
        }

        .search-area {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .search-area input {
            width: 500px;
            max-width: 70%;
            padding: 15px;
            font-size: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
        }

        .search-area input:focus {
            border-color: #111;
        }

        .search-area button {
            padding: 15px 28px;
            font-size: 18px;
            background: #111;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .search-area button:hover {
            background: #333;
        }


        /* =========================
           RESULT
        ========================= */

        .result {
            margin-top: 25px;
            font-size: 23px;
            font-weight: bold;
        }

        .result .zone {
            color: #111;
        }

        .result.error {
            color: #c0392b;
        }


        /* =========================
           MAP SECTION
        ========================= */

        .map-section {
            display: none;
            margin-top: 30px;
            background: white;
            padding: 20px;
            border-radius: 14px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        .map-section.active {
            display: block;
        }

        .map-section h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 20px;
        }


        /* =========================
           MAP CONTAINER
        ========================= */

        .map-container {
            position: relative;
            width: 100%;
        }

        .map {
            width: 100%;
            height: auto;
            display: block;
        }


        /* =========================
           HIGHLIGHT
        ========================= */

        .zone-highlight {
            position: absolute;

            border: 4px solid #ff0000;

            background: rgba(255, 255, 0, 0.12);

            box-shadow:
                0 0 8px rgba(255, 0, 0, 0.9),
                inset 0 0 8px rgba(255, 0, 0, 0.35);

            pointer-events: none;

            display: none;

            z-index: 10;

            border-radius: 3px;
        }

        .zone-highlight.active {
            display: block;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            header h1 {
                font-size: 28px;
            }

            .container {
                margin: 20px auto;
                padding: 0 10px;
            }

            .search-box {
                padding: 20px;
            }

            .search-area {
                flex-direction: column;
            }

            .search-area input {
                width: 100%;
                max-width: 100%;
            }

            .search-area button {
                width: 100%;
            }

            .result {
                font-size: 20px;
            }

            .map-section {
                padding: 10px;
            }

        }

    </style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

    <h1>Zone Finder</h1>

    <p>Find the location of an item</p>

</header>



<div class="container">


    <!-- =========================
         SEARCH
    ========================= -->

    <div class="search-box">

        <h2>Search for an Item</h2>

        <div class="search-area">

            <input
                type="text"
                id="itemSearch"
                placeholder="Enter item number..."
            >

            <button onclick="findItem()">
                Search
            </button>

        </div>

        <div
            class="result"
            id="result"
        ></div>

    </div>



    <!-- =========================
         MEN'S UNIVERSE
    ========================= -->

    <div
        class="map-section"
        id="mensMap"
    >

        <h2>Men's Universe</h2>

        <div class="map-container">

            <img
                class="map"
                src="map-mens.png.png"
                alt="Men's Universe Map"
            >

            <div
                class="zone-highlight"
                id="mensHighlight"
            ></div>

        </div>

    </div>



    <!-- =========================
         WOMEN'S UNIVERSE
    ========================= -->

    <div
        class="map-section"
        id="womensMap"
    >

        <h2>Women's Universe</h2>

        <div class="map-container">

            <img
                class="map"
                src="map-womens.png.png"
                alt="Women's Universe Map"
            >

            <div
                class="zone-highlight"
                id="womensHighlight"
            ></div>

        </div>

    </div>



    <!-- =========================
         ADDITIONAL STOCKROOM
    ========================= -->

    <div
        class="map-section"
        id="additionalMap"
    >

        <h2>Additional Stockroom</h2>

        <div class="map-container">

            <img
                class="map"
                src="map-additional.png.png"
                alt="Additional Stockroom Map"
            >

            <div
                class="zone-highlight"
                id="additionalHighlight"
            ></div>

        </div>

    </div>


</div>



<script>


/* =====================================================
   TEST ITEM DATABASE
===================================================== */


const itemLocations = {

    "100001": {
        map: "mens",
        zone: 1
    },

    "100002": {
        map: "mens",
        zone: 5
    },

    "100003": {
        map: "mens",
        zone: 10
    },


    "200001": {
        map: "womens",
        zone: 11
    },

    "200002": {
        map: "womens",
        zone: 12
    },

    "200003": {
        map: "womens",
        zone: 13
    },


    "300001": {
        map: "additional",
        zone: 80
    },

    "300002": {
        map: "additional",
        zone: 82
    },

    "300003": {
        map: "additional",
        zone: 85
    }

};



/* =====================================================
   SEARCH
===================================================== */


function findItem() {

    const input =
        document.getElementById("itemSearch");

    const item =
        input.value.trim();

    const result =
        document.getElementById("result");


    /* Hide every map */

    document
        .querySelectorAll(".map-section")
        .forEach(map => {

            map.classList.remove("active");

        });


    /* Hide every highlight */

    document
        .querySelectorAll(".zone-highlight")
        .forEach(highlight => {

            highlight.classList.remove("active");

        });


    /* Empty search */

    if (item === "") {

        result.innerHTML =
            "Please enter an item number.";

        result.className =
            "result error";

        return;

    }


    /* Find item */

    const location =
        itemLocations[item];


    /* Item doesn't exist */

    if (!location) {

        result.innerHTML =
            "Item not found.";

        result.className =
            "result error";

        return;

    }


    /* Show location */

    result.innerHTML =
        "Location: <span class='zone'>Zone " +
        location.zone +
        "</span>";

    result.className =
        "result";


    /* =========================================
       MEN'S
    ========================================= */

    if (location.map === "mens") {

        document
            .getElementById("mensMap")
            .classList.add("active");

        highlightMensZone(location.zone);

    }


    /* =========================================
       WOMEN'S
    ========================================= */

    if (location.map === "womens") {

        document
            .getElementById("womensMap")
            .classList.add("active");

        highlightWomensZone(location.zone);

    }


    /* =========================================
       ADDITIONAL
    ========================================= */

    if (location.map === "additional") {

        document
            .getElementById("additionalMap")
            .classList.add("active");

        highlightAdditionalZone(location.zone);

    }

}



/* =====================================================
   ENTER KEY
===================================================== */


document
    .getElementById("itemSearch")
    .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {

            findItem();

        }

    });



/* =====================================================
   MEN'S UNIVERSE
===================================================== */


/*
   Coordinates are percentages of the actual map.

   These match the colored areas on the
   Men's Universe map.
*/


function highlightMensZone(zone) {

    const highlight =
        document.getElementById("mensHighlight");


    const zones = {


        /* Zone 1 */

        1: {
            left: "71.2%",
            top: "61.0%",
            width: "15.2%",
            height: "18.5%"
        },


        /* Zone 2 */

        2: {
            left: "48.5%",
            top: "70.0%",
            width: "20.5%",
            height: "17.0%"
        },


        /* Zone 3 */

        3: {
            left: "48.5%",
            top: "43.5%",
            width: "20.5%",
            height: "27.0%"
        },


        /* Zone 4 */

        4: {
            left: "24.3%",
            top: "43.5%",
            width: "20.8%",
            height: "43.5%"
        },


        /* Zone 5 */

        5: {
            left: "6.6%",
            top: "61.0%",
            width: "17.4%",
            height: "26.0%"
        },


        /* Zone 6 */

        6: {
            left: "6.6%",
            top: "43.5%",
            width: "17.4%",
            height: "18.0%"
        },


        /* Zone 7 */

        7: {
            left: "10.5%",
            top: "10.5%",
            width: "12.0%",
            height: "30.0%"
        },


        /* Zone 8 */

        8: {
            left: "24.0%",
            top: "10.5%",
            width: "21.0%",
            height: "30.0%"
        },


        /* Zone 9 */

        9: {
            left: "48.3%",
            top: "10.5%",
            width: "20.5%",
            height: "30.0%"
        },


        /* Zone 10 */

        10: {
            left: "71.8%",
            top: "10.5%",
            width: "15.0%",
            height: "30.0%"
        }

    };


    const position =
        zones[zone];


    if (!position) return;


    highlight.style.left =
        position.left;

    highlight.style.top =
        position.top;

    highlight.style.width =
        position.width;

    highlight.style.height =
        position.height;


    highlight.classList.add("active");

}



/* =====================================================
   WOMEN'S UNIVERSE
===================================================== */


/*
   Coordinates match the actual colored
   sections of the Women's Universe map.
*/


function highlightWomensZone(zone) {

    const highlight =
        document.getElementById("womensHighlight");


    const zones = {


        /* Zone 11 */

        11: {
            left: "9.0%",
            top: "13.8%",
            width: "32.5%",
            height: "73.0%"
        },


        /* Zone 12 */

        12: {
            left: "44.3%",
            top: "13.8%",
            width: "20.5%",
            height: "30.0%"
        },


        /* Zone 13 */

        13: {
            left: "66.7%",
            top: "13.8%",
            width: "22.0%",
            height: "30.0%"
        }

    };


    const position =
        zones[zone];


    if (!position) return;


    highlight.style.left =
        position.left;

    highlight.style.top =
        position.top;

    highlight.style.width =
        position.width;

    highlight.style.height =
        position.height;


    highlight.classList.add("active");

}



/* =====================================================
   ADDITIONAL STOCKROOM
===================================================== */


/*
   Zones 80-83 are the large colored areas.

   Zones 84 and 85 are the small marked
   areas at the bottom/right of the map.
*/


function highlightAdditionalZone(zone) {

    const highlight =
        document.getElementById("additionalHighlight");


    const zones = {


        /* Zone 80 */

        80: {
            left: "1.0%",
            top: "3.5%",
            width: "24.0%",
            height: "45.0%"
        },


        /* Zone 81 */

        81: {
            left: "25.5%",
            top: "3.5%",
            width: "24.0%",
            height: "45.0%"
        },


        /* Zone 82 */

        82: {
            left: "49.8%",
            top: "3.5%",
            width: "24.5%",
            height: "45.0%"
        },


        /* Zone 83 */

        83: {
            left: "74.5%",
            top: "3.5%",
            width: "24.0%",
            height: "45.0%"
        },


        /* Zone 84 */

        84: {
            left: "82.7%",
            top: "48.0%",
            width: "10.8%",
            height: "7.0%"
        },


        /* Zone 85 */

        85: {
            left: "69.8%",
            top: "51.5%",
            width: "11.8%",
            height: "7.0%"
        }

    };


    const position =
        zones[zone];


    if (!position) return;


    highlight.style.left =
        position.left;

    highlight.style.top =
        position.top;

    highlight.style.width =
        position.width;

    highlight.style.height =
        position.height;


    highlight.classList.add("active");

}


</script>


</body>

</html>
